# PR마다 전체 테스트를 돈다. MCP 리포는 pyproject.toml에 고정한 커밋으로 설치된다.
name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: 설치
        run: python -m pip install ".[test]"
      - name: 테스트
        run: python -m pytest tests/ -q
